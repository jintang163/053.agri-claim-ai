server:
  port: 8082

spring:
  application:
    name: agri-claim-system
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: agri-claim-dev
        group: AGRI_CLAIM_GROUP
      config:
        server-addr: 127.0.0.1:8848
        namespace: agri-claim-dev
        group: AGRI_CLAIM_GROUP
        file-extension: yaml
        shared-configs:
          - data-id: agri-claim-common.yaml
            group: AGRI_CLAIM_GROUP
            refresh: true

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/agri_claim?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: root123
    druid:
      initial-size: 5
      min-idle: 10
      max-active: 20

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
      timeout: 10s

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: agri-claim-system-group

seata:
  enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.agri.claim: debug
