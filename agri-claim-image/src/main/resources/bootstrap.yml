server:
  port: 8083

spring:
  application:
    name: agri-claim-image
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: agri-claim-dev
        group: AGRI_CLAIM_GROUP
      config:
        server-addr: 127.0.0.1:8848
        namespace: agri-claim-dev
        group: AGRI_CLAIM_GROUP
        file-extension: yaml

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/agri_claim?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: root123
    druid:
      initial-size: 5
      min-idle: 10
      max-active: 50

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0

minio:
  endpoint: http://127.0.0.1:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucketName: agri-images

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: agri-claim-image-group

influxdb:
  url: http://127.0.0.1:8086
  token: my-token
  org: agri-claim
  bucket: remote-sensing

seata:
  enabled: false

springdoc:
  api-docs:
    enabled: true
knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.agri.claim: debug
