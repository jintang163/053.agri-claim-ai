server:
  port: 8081

spring:
  application:
    name: agri-claim-auth
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: agri-claim-dev
        group: AGRI_CLAIM_GROUP
      config:
        server-addr: 127.0.0.1:8848
        namespace: agri-claim-dev
        group: AGRI_CLAIM_GROUP
        file-extension: yaml
        shared-configs:
          - data-id: agri-claim-common.yaml
            group: AGRI_CLAIM_GROUP
            refresh: true

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/agri_claim?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: root123
    druid:
      initial-size: 5
      min-idle: 10
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 32
          max-wait: 5000ms
          max-idle: 16
          min-idle: 4

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn

seata:
  enabled: false
  application-id: agri-claim-auth
  tx-service-group: agri-claim-tx-group
  service:
    vgroup-mapping:
      agri-claim-tx-group: default
  registry:
    type: nacos
    nacos:
      server-addr: 127.0.0.1:8848
      namespace: agri-claim-dev
      group: AGRI_CLAIM_GROUP
      application: seata-server

logging:
  level:
    com.agri.claim: debug
    org.springframework: info
